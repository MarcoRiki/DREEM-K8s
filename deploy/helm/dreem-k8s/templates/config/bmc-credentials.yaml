{{- range .Values.config.bmcCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bmc-credentials-{{ required "config.bmcCredentials[].node is required" .node }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dreem.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ .username | quote }}
  password: {{ .password | quote }}
  bmc_address: {{ .bmcAddress | quote }}
  id: {{ .id | toString | quote }}
{{- end }}
