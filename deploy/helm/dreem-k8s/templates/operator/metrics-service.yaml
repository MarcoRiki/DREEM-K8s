{{- if .Values.operator.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dreem.fullname" . }}-operator-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dreem.componentLabels" (list . "operator") | nindent 4 }}
    control-plane: controller-manager
spec:
  ports:
    - name: https
      port: {{ .Values.operator.metrics.port }}
      protocol: TCP
      targetPort: metrics
  selector:
    {{- include "dreem.selectorLabels" (list . "operator") | nindent 4 }}
    control-plane: controller-manager
{{- end }}
