{{- if .Values.forecast.enabled }}
{{- $sa := include "dreem.forecast.serviceAccountName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dreem.componentLabels" (list . "forecast") | nindent 4 }}
---
# Read the DREEM ConfigMaps and create ClusterConfigurations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dreem.fullname" . }}-forecast
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dreem.componentLabels" (list . "forecast") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.dreemk8s"]
    resources: ["clusterconfigurations"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["cluster.dreemk8s"]
    resources: ["clusterconfigurations/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dreem.fullname" . }}-forecast
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dreem.componentLabels" (list . "forecast") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dreem.fullname" . }}-forecast
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Nodes (active and powered-off workers) and Pods in every namespace (the
# Unschedulable pods that Menouer et al.'s algorithm counts as pending)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dreem.fullname" . }}-forecast-machines-reader
  labels:
    {{- include "dreem.componentLabels" (list . "forecast") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dreem.fullname" . }}-forecast-machines-reader
  labels:
    {{- include "dreem.componentLabels" (list . "forecast") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dreem.fullname" . }}-forecast-machines-reader
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
