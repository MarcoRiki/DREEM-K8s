# DREEM looks up its ConfigMaps, Secrets and custom resources in the "dreem"
# namespace (hardcoded in the operator and in the forecaster), so the chart
# must be installed with: helm install <release> <chart> -n dreem --create-namespace

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Default Prometheus endpoint, used by the forecaster and the metricUpdate
# CronJob unless they set their own prometheusUrl.
prometheus:
  url: http://kind-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090

crds:
  # Render the cluster.dreemk8s CRDs from files/crds (synced with `make helm-sync`).
  install: true
  # Keep the CRDs, and therefore every ClusterConfiguration/NodeSelecting/
  # NodeHandling, when the release is uninstalled.
  keep: true

# --------------------------------------------------------------------------
# Operator (controller-manager)
# --------------------------------------------------------------------------
operator:
  replicas: 1
  image:
    repository: harbor.ng.crownlabs.polito.it/marco-miracapillo/dreem-k8s-menouer/menouer-operator
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  leaderElect: true
  extraArgs: []
  metrics:
    # Expose /metrics over HTTPS on 8443, protected by authn/authz.
    enabled: true
    port: 8443
  resources:
    limits:
      cpu: 2500m
      memory: 4096Mi
    requests:
      cpu: 256m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  affinity: {}

# --------------------------------------------------------------------------
# Forecaster: runs Menouer et al.'s Algorithm 1 and requests the scaling
# --------------------------------------------------------------------------
forecast:
  enabled: true
  image:
    repository: harbor.ng.crownlabs.polito.it/marco-miracapillo/dreem-k8s-menouer/menouer-forecaster
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  # Minutes to wait before the first decision.
  startAfter: 5
  # Overrides prometheus.url when set.
  prometheusUrl: ""
  extraArgs: []
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  affinity: {}

# --------------------------------------------------------------------------
# metricUpdate CronJob (optional): refreshes the node energy profiles
# --------------------------------------------------------------------------
metricUpdate:
  enabled: false
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  image:
    repository: harbor.ng.crownlabs.polito.it/marco-miracapillo/dreem-k8s/energy-profile-update
    tag: "0.0.7"
    pullPolicy: Always
  # Observation window, in hours.
  hours: 24
  # Sampling period, in seconds.
  step: 30
  # Overrides prometheus.url when set.
  prometheusUrl: ""
  extraArgs: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------------
# DREEM configuration (ConfigMaps read by the operator and the forecaster).
# The ConfigMap names are fixed: the components look them up by name.
# See deploy/configmaps/README.md for the meaning of each parameter.
# --------------------------------------------------------------------------
config:
  # ConfigMap cluster-configuration-parameters
  clusterConfiguration:
    minNodes: 1
    maxNodes: 3
    # false: Menouer et al. as published; true: a node is switched off only if its pods fit on the other nodes
    hardChecks: false

  # ConfigMap forecast-parameters: Algorithm 1 of Menouer et al., with the paper's values
  forecastParameters:
    Enabled: true
    Menouer_load_up: 65 # %
    Menouer_load_down: 40 # %
    Menouer_pending_pod_seconds: 120
    Menouer_period_seconds: 60

  # One Secret bmc-credentials-<node> per entry, read by the NodeHandling
  # controller to power servers on/off. Leave empty to manage the Secrets
  # outside the chart. Example:
  #   - node: dreem-kind-worker
  #     username: admin
  #     password: changeme
  #     bmcAddress: 10.0.0.10
  #     id: "1"
  bmcCredentials: []
