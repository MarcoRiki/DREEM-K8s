apiVersion: v1
kind: ConfigMap
metadata:
  name: forecast-parameters
  namespace: dreem
data:
  Enabled: "true"

  # --- Algorithm 1 of Menouer et al. (FRAME@HPDC 2024); the values are the paper's ---
  # Scale-up when a pod is pending and the CPU, memory or storage load of the
  # active workers is at least Menouer_load_up, or when a pod has been pending
  # for more than Menouer_pending_pod_seconds. Scale-down when no pod is pending
  # and all three loads are at most Menouer_load_down. Checked every
  # Menouer_period_seconds, one node at a time.
  Menouer_load_up: "70"              # %
  Menouer_load_down: "40"            # %
  Menouer_pending_pod_seconds: "120"
  Menouer_period_seconds: "60"
