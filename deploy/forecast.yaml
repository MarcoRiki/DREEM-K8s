apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-deployment
  namespace: dreem
  labels:
    app: forecast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forecast
  template:
    metadata:
      labels:
        app: forecast
    spec:
      # schedule only on the k3s control-plane node and tolerate control-plane/master taints
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      serviceAccountName: forecast-sa
      containers:
      - name: forecast
        image: harbor.ng.crownlabs.polito.it/marco-miracapillo/dreem-k8s-menouer/menouer-forecaster:0.0.1
        args: ["--start-after", "5", "--prometheus-url", "http://kind-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090"]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forecast-sa
  namespace: dreem

---
# Role per accedere a ConfigMaps e ClusterConfigurations nel namespace dreem
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forecast-role
  namespace: dreem
rules:
  # Permessi per leggere ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  
  # Permessi per ClusterConfiguration CRD
  - apiGroups: ["cluster.dreemk8s"]
    resources: ["clusterconfigurations"]
    verbs: ["get", "list", "watch", "create"]
  
  # Permessi per leggere lo status di ClusterConfiguration
  - apiGroups: ["cluster.dreemk8s"]
    resources: ["clusterconfigurations/status"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forecast-rolebinding
  namespace: dreem
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forecast-role
subjects:
  - kind: ServiceAccount
    name: forecast-sa
    namespace: dreem

---
# ClusterRole per leggere Nodes e Pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forecast-machines-reader
rules:
  # Permessi per leggere Nodes: worker attivi e spenti
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Permessi per leggere i Pod in tutti i namespace: i pod Unschedulable,
  # i Pending_pods dell'algoritmo di Menouer et al.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forecast-machines-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forecast-machines-reader
subjects:
  - kind: ServiceAccount
    name: forecast-sa
    namespace: dreem
